name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Don't include credentials, hostnames, clients or customer names.**
        Security issues go through SECURITY.md, not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call `sap_read_source` with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Audit log excerpt (anonymized)
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run it?
      options:
        - Docker
        - npx
        - From source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: SAP release / system type
      placeholder: "e.g. S/4HANA 2023 on-premise, ABAP Platform Trial"
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "e.g. Claude Desktop, VS Code"
